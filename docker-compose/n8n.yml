services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:5678:5678"
    labels:
    - traefik.http.routers.n8n.rule=Host(`n8n.christopherenea.net`)
    - traefik.http.routers.n8n.tls=true
    - traefik.port=443
    - traefik.http.routers.n8n.tls.certresolver=myresolver
    - traefik.docker.network=traefik
    environment:
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - NODE_ENV=production
    - N8N_WEBHOOK_URL=https://n8n.christopherenea.net/
    - GENERIC_TIMEZONE=${TZ}
    - TZ=${TZ}
    - N8N_RESTRICT_FILE_ACCESS_TO=/files
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
    - n8n_data:/home/node/.n8n
    - ./local-files:/files
    networks:
    - traefik
    - n8n_internal

  task-runners:
    image: n8nio/runners:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
    - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    networks:
    - n8n_internal
    depends_on:
    - n8n

networks:
  traefik:
    name: traefik
    external: true
  n8n_internal:
    internal: true

volumes:
  n8n_data:

    # Environment Variables
    # ---------------------
    # N8N_VERSION=latest
    # SUBDOMAIN=
    # DOMAIN_NAME=
    # TZ=
    # N8N_RUNNERS_AUTH_TOKEN=(generate with openssl rand -base64 48)
