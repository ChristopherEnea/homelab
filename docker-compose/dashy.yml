---
version: "3.8"

services:
  dashy:
    # To build from source, replace 'image: lissy93/dashy' with 'build: .'
    # build: .
    image: lissy93/dashy
    container_name: Dashy
    # Pass in your config file below, by specifying the path on your host machine
    # volumes:
      # - /root/my-config.yml:/app/public/conf.yml
    # ports:
    #   - 4000:80
    # Set any environmental variables
    environment:
      - NODE_ENV=production
      - ROUTER_NAME=dashy
    # Specify your user ID and group ID. You can find this by running `id -u` and `id -g`
    #  - UID=1000
    #  - GID=1000
    # Specify restart policy
    restart: unless-stopped
    # Configure healthchecks
    healthcheck:
      test: ['CMD', 'node', '/app/services/healthcheck']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # traefik
      - traefik.http.routers.${ROUTER_NAME}.rule=Host(`${ROUTER_NAME}.christopherenea.net`)
      - traefik.http.routers.${ROUTER_NAME}.tls=true
      - traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=80
      - traefik.http.routers.${ROUTER_NAME}.tls.certresolver=myresolver
      - traefik.port=443
      # watchtower
      - com.centurylinklabs.watchtower.enable=true
      # homepage
      - homepage.group=Homelab
      - homepage.name=Dashy
      - homepage.icon=sh.dashy.svg
      - homepage.href=http://dashboard.christopherenea.net/
      - homepage.description=Dashboard for managing your services
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    external: true